<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="grad1" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#03AC0E;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1920" height="1080" fill="#000000" />
  <rect width="1920" height="1080" fill="url(#grad1)" />
  
  <!-- Subtle grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0,270 L1920,270 M0,540 L1920,540 M0,810 L1920,810" />
    <path d="M480,0 L480,1080 M960,0 L960,1080 M1440,0 L1440,1080" />
  </g>
  
  <!-- Main content -->
  <g transform="translate(960, 540)" filter="url(#glow)">
    <!-- Main Tokopedia text -->
    <text x="0" y="-20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="140" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-4">tokopedia</text>
    
    <!-- Subtitle -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="35" font-weight="600" fill="#03AC0E" text-anchor="middle" letter-spacing="12">SENTIMENT AI</text>
  </g>
</svg>
